services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: techstack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-techstack}
      POSTGRES_USER: ${POSTGRES_USER:-techstack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      # Keep the host port outside Windows reserved ranges; PostgreSQL uses 5432 inside the container.
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-techstack} -d ${POSTGRES_DB:-techstack}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
